name: Bug report
description: Report a reproducible core or adapter issue without secrets.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, private target addresses, real screenshots, or sensitive traces. For vulnerabilities, read SECURITY.md."
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python/package versions, mock or real RDP, model type and display size (no endpoint addresses).
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use synthetic inputs and harmless tasks. Distinguish mocked behavior from a real server run.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, personal data, internal addresses, and sensitive desktop content.
          required: true
