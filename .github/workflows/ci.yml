name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python tools/verify.py

  adapters:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[all]"
      - run: python -m pip check
      - run: rdp-cua doctor --require-adapters
      - run: python tools/verify.py --require-adapters

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python tools/check_release.py
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python tools/verify_artifacts.py dist/*
      - name: Clean wheel install
        shell: bash
        run: |
          python -m venv wheel-test
          wheel-test/bin/python -m pip install --no-deps dist/*.whl
          wheel-test/bin/rdp-cua demo
      - run: python tools/package_source.py --output rdp-computer-use-source.zip
      - run: python tools/verify_artifacts.py rdp-computer-use-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: alpha-artifacts
          path: |
            dist/*
            rdp-computer-use-source.zip
            rdp-computer-use-source.zip.sha256
