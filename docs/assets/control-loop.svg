<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 790" role="img" lang="en" aria-labelledby="archify-diagram-title archify-diagram-description" data-preset="classic" data-quality-profile="showcase"><style>text{font-family:Arial,Helvetica,sans-serif}

    /* ==========================================================
       SVG SEMANTIC CLASSES — use these instead of inline fill/stroke
       ========================================================== */
    .c-grid       { stroke: #1e293b; fill: none; }

    .c-mask       { fill: #0f172a; stroke: none; }


    .c-frontend   { fill: rgba(8, 51, 68, 0.4);   stroke: #22d3ee; }

    .c-backend    { fill: rgba(6, 78, 59, 0.4);    stroke: #34d399; }

    .c-database   { fill: rgba(76, 29, 149, 0.4);   stroke: #a78bfa; }

    .c-cloud      { fill: rgba(120, 53, 15, 0.3);      stroke: #fbbf24; }

    .c-security   { fill: rgba(136, 19, 55, 0.4);   stroke: #fb7185; }

    .c-messagebus { fill: rgba(251, 146, 60, 0.3); stroke: #fb923c; }

    .c-external   { fill: rgba(30, 41, 59, 0.5);   stroke: #94a3b8; }


    /* Text helpers */
    .t-primary { fill: #ffffff; }

    .t-muted   { fill: #94a3b8; }

    .t-dim     { fill: #475569; }

    .t-frontend   { fill: #22d3ee; }

    .t-backend    { fill: #34d399; }

    .t-database   { fill: #a78bfa; }

    .t-cloud      { fill: #fbbf24; }

    .t-security   { fill: #fb7185; }

    .t-messagebus { fill: #fb923c; }

    .t-external   { fill: #94a3b8; }


    /* Semantic Sigils are small authored role stamps, not icons from a brand
       pack and not viewer controls. Prefix selectors with svg so the canonical
       export's SVG-only stylesheet collector keeps them automatically. */
    svg .semantic-sigil {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.35;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.76;
      pointer-events: none;
    }

    svg .semantic-sigil > * { vector-effect: non-scaling-stroke; }

    svg .semantic-sigil .sigil-fill { fill: currentColor; stroke: none; }

    svg .s-frontend   { color: #22d3ee; }

    svg .s-backend    { color: #34d399; }

    svg .s-database   { color: #a78bfa; }

    svg .s-cloud      { color: #fbbf24; }

    svg .s-security   { color: #fb7185; }

    svg .s-messagebus { color: #fb923c; }

    svg .s-external   { color: #94a3b8; }


    /* Arrows */
    .a-default   { stroke: #64748b; fill: none; }

    .a-emphasis  { stroke: #34d399; fill: none; }

    .a-security  { stroke: #fb7185; fill: none; stroke-dasharray: 5,5; }

    .a-dashed    { stroke: #a78bfa; fill: none; stroke-dasharray: 4,4; }


    /* Arrowhead markers reference these */
    .m-default   { fill: #64748b; }

    .m-emphasis  { fill: #34d399; }

    .m-security  { fill: #fb7185; }

    .m-dashed    { fill: #a78bfa; }


    /* Dashed boundary variants */
    .c-security-group { fill: transparent; stroke: #fb7185; stroke-dasharray: 4,4; }

    .c-region         { fill: rgba(251, 191, 36, 0.05); stroke: #fbbf24; stroke-dasharray: 8,4; }

    .c-lane           { fill: rgba(15, 23, 42, 0.22); stroke: #334155; stroke-dasharray: 6,6; }</style><rect width="100%" height="100%" fill="#020617"/>
