<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
  <title id="title">RDP Computer-Use</title>
  <desc id="desc">Turn a remote desktop into an automation interface. Observe, decide, act, verify. An alpha-stage MIT project.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1221"/><stop offset="1" stop-color="#12273b"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#54e2d2"/><stop offset="1" stop-color="#76aaff"/></linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#8ba6bd" opacity=".16"/></pattern>
  </defs>
  <rect width="1280" height="460" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="460" rx="24" fill="url(#dots)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="58" y="54" width="254" height="30" rx="15" fill="#183b43"/>
    <text x="78" y="74" font-size="12" font-weight="700" letter-spacing="2" fill="#79eee0">GUI AUTOMATION OVER RDP</text>
    <text x="58" y="159" font-size="57" font-weight="700" letter-spacing="-2" fill="#f3f7ff">RDP Computer-Use</text>
    <text x="61" y="214" font-size="24" fill="#b6c8da">Turn a remote desktop into</text>
    <text x="61" y="249" font-size="24" fill="#b6c8da">an automation interface.</text>
    <rect x="61" y="284" width="92" height="4" rx="2" fill="url(#accent)"/>
    <text x="61" y="336" font-size="16" fill="#dae6f2">No target-side agent. Pluggable vision models.</text>
    <text x="61" y="386" font-size="13" letter-spacing="1.5" fill="#8ea9c1">PYTHON 3.11+   /   MIT LICENSE   /   ALPHA</text>
    <g transform="translate(797 83)">
      <rect width="412" height="251" rx="15" fill="#0a1424" stroke="#466079" stroke-width="1.5"/>
      <path d="M0 36H412" stroke="#304457"/>
      <circle cx="20" cy="18" r="4" fill="#54e2d2"/><circle cx="36" cy="18" r="4" fill="#54728b"/><circle cx="52" cy="18" r="4" fill="#54728b"/>
      <text x="392" y="23" text-anchor="end" font-size="11" letter-spacing="1.4" fill="#8ea9c1">REMOTE DESKTOP</text>
      <rect x="25" y="59" width="91" height="168" rx="6" fill="#14263a"/>
      <path d="M41 82h58M41 103h44M41 124h52" stroke="#496981" stroke-width="6" stroke-linecap="round"/>
      <rect x="135" y="59" width="251" height="168" rx="6" fill="#182e43"/>
      <rect x="158" y="84" width="172" height="10" rx="5" fill="#6795b6"/>
      <rect x="158" y="109" width="128" height="7" rx="3" fill="#385f7b"/>
      <rect x="158" y="132" width="188" height="7" rx="3" fill="#385f7b"/>
      <rect x="153" y="162" width="125" height="44" rx="8" fill="none" stroke="#54e2d2" stroke-width="2" stroke-dasharray="5 4"/>
      <text x="216" y="189" text-anchor="middle" font-size="13" fill="#7cf1e2">One action</text>
      <path d="M295 180l8 30 7-11 14-3z" fill="#f2f6ff"/>
    </g>
    <path d="M807 369h390" stroke="#3e5a72"/>
    <g font-size="12" font-weight="700" letter-spacing="1" fill="#8bb8d5" text-anchor="middle">
      <text x="829" y="397">OBSERVE</text><text x="946" y="397">DECIDE</text><text x="1055" y="397">ACT</text><text x="1170" y="397" fill="#79eee0">VERIFY</text>
    </g>
    <g fill="#54e2d2"><circle cx="829" cy="369" r="4"/><circle cx="946" cy="369" r="4"/><circle cx="1055" cy="369" r="4"/><circle cx="1170" cy="369" r="4"/></g>
  </g>
</svg>
